[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/guest-contract",
  "crates/nft-render",
  "crates/nibrunnerd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"

# Lint levels live here rather than as `#![deny(...)]` at the top of every crate root: one place
# to change them, and a crate that opts in with `[lints] workspace = true` cannot drift from the
# rest by forgetting an attribute.
[workspace.lints.rust]
# A public item with no `///` is one a reader has to infer the purpose of from its name.
missing_docs = "allow"
unsafe_code = "warn"
unreachable_pub = "warn"
# `unused_qualifications` is deliberately absent. It flags `protocol::Timestamp::epoch_ms` where
# `Timestamp` is already imported, and in a file that names types from four crates the qualified
# spelling is the one that tells a reader where something came from.

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

# The ones that turn a crash into a compile error. This daemon holds tenants' microVMs up: a
# panic in a reconcile pass takes the loop with it, and every one of these is a panic written as
# an expression.
unwrap_used = "warn"
expect_used = "allow"
panic = "warn"
indexing_slicing = "allow"

# Arithmetic that can wrap silently. Slot numbers, byte counts and memory sizes are all here.
cast_possible_truncation = "allow"
# `integer_division` is allowed rather than warned: every division in this codebase is a
# deliberate floor — mebibytes from bytes, an octet from an index — and each is commented where
# the rounding matters. A lint that fires on all of them says nothing about any of them.
integer_division = "allow"

# What this codebase is deliberately full of, and does not want flagged.
too_many_lines = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
protocol = { path = "crates/protocol", package = "nibrunner-protocol" }
guest-contract = { path = "crates/guest-contract", package = "nibrunner-guest-contract" }
nft-render = { path = "crates/nft-render", package = "nibrunner-nft-render" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "server", "server-auto"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
# `aws-base` + `ring` rather than the `aws` feature: `aws` forces the aws-lc-rs backend, whose
# `aws-lc-sys` needs cmake and a C toolchain for the target — which is the one thing that would
# stop this being a static cross-compiled binary. object_store signs with ring instead.
object_store = { version = "0.14", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
# object_store's own `reqwest` feature turns on the dependency without a TLS backend, so the
# backend is chosen here. `rustls-no-provider` keeps aws-lc-rs out; `main` installs ring's
# provider before anything dials, because rustls refuses to pick one for itself.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "json"] }
slatedb = { version = "0.16", default-features = false, features = ["moka"] }
backhand = { version = "0.25", default-features = false, features = ["gzip"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
nix = { version = "0.30", features = ["inotify", "ioctl", "signal", "process", "fs", "socket", "net"] }
rtnetlink = { version = "0.23", default-features = false, features = ["tokio_socket"] }
netlink-packet-route = "0.33"
nbd-netlink = "0.3"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
