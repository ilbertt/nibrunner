name: tmp-release

on: workflow_dispatch

permissions:
  contents: write # cut the tag and the prerelease

# The version is a same-day counter read off the tags, so two runs at once would both read the
# same list and compute the same number.
concurrency:
  group: tmp-release
  cancel-in-progress: false

jobs:
  tmp-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The counter is computed from the tags already cut, which a tagless clone would compute
          # from nothing. No history is read, so the clone itself stays shallow.
          fetch-tags: true

      - uses: ./.github/actions/prepare
        with:
          cache: enabled

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # Not in the runner image, and the version the release carries is computed by a recipe.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build
        run: cargo build -p nibrunnerd --release --target x86_64-unknown-linux-musl

      - name: Name the release
        id: version
        run: echo "tag=$(just tmp-version)" >> "$GITHUB_OUTPUT"

      - name: Stage the asset
        env:
          DIST: ${{ runner.temp }}/dist
        run: |
          mkdir -p "$DIST"
          install -m 0755 target/x86_64-unknown-linux-musl/release/nibrunnerd "$DIST/nibrunnerd-linux-x64"
          # From inside the directory, so the file names what `sha256sum -c` will be run next to.
          cd "$DIST" && sha256sum nibrunnerd-linux-x64 > checksums.txt

      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DIST: ${{ runner.temp }}/dist
        run: |
          # The tag is cut here rather than pushed by hand, so it can only ever name a commit this
          # binary was built from.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "" \
            --prerelease \
            --target "$GITHUB_SHA" \
            "$DIST/nibrunnerd-linux-x64" \
            "$DIST/checksums.txt"
