name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-release

      - name: Check the tag names the version built
        run: test "v$(just version)" = "$GITHUB_REF_NAME"

      - name: Build the guest image
        run: just guest-image

      - name: Verify the guest image
        run: just verify-guest-image

      - name: Stage the assets
        run: just stage-release "$RUNNER_TEMP/dist"

      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "" \
            --prerelease \
            "$RUNNER_TEMP/dist"/*
