name: checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  codestyle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: disabled
          prepare_for_build: disabled

      - name: Check Rust Codestyle
        run: just fmt --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: enabled
          prepare_for_build: disabled

      - name: Lint
        run: just lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: enabled
          prepare_for_build: disabled

      - name: Run Tests
        run: just test

  # Every file in the tree that is written from the code rather than by hand.
  generated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: enabled
          prepare_for_build: disabled

      - name: Check the schemas are current
        run: just check-schema

      - name: Check the example configuration is current
        run: just check-config-example

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare
        with:
          cache: enabled
          prepare_for_build: disabled

      - name: Install what the lane drives
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables e2fsprogs
          ls -l /dev/net/tun
          ls -l /dev/kvm || echo "no /dev/kvm on this runner"

      - name: Build the integration tests
        run: cargo test -p nibrunnerd --test integration --no-run

      - name: Run the integration tests
        # sudo's secure_path drops the runner's PATH, so it is handed back; -E keeps HOME, which is
        # where rustup, cargo and mise live.
        run: sudo -E env "PATH=$PATH" just integration

  checks-passed:
    if: always()
    name: checks:required
    needs: [codestyle, lint, tests, generated, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI jobs passed"
