name: Prepare integration host
description: Prepare the tools, devices and host security required by integration tests

inputs:
  shared-cache-key:
    description: A name for jobs that build the same thing to share one cargo cache under. Empty keys the cache by job.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: ./.github/actions/prepare
      with:
        cache: enabled
        prepare-for-build: enabled
        shared-cache-key: ${{ inputs.shared-cache-key }}

    - name: Check the machine can host
      shell: bash
      run: |
        uname -a
        cat /etc/os-release
        lscpu
        ls -l /dev/net/tun /dev/kvm
        test -c /dev/net/tun
        test -c /dev/kvm
        cat /sys/fs/cgroup/cgroup.controllers

    - name: Disable host SMT
      shell: bash
      run: |
        smt_directory=/sys/devices/system/cpu/smt
        if [[ "$(cat "$smt_directory/active")" == 1 ]]; then
          echo forceoff | sudo tee "$smt_directory/control"
        fi
        test "$(cat "$smt_directory/active")" = 0

    - name: Check KVM can create a VM
      shell: bash
      run: |
        sudo python3 - <<'PY'
        import fcntl
        import os

        with open("/dev/kvm", "r+b", buffering=0) as kvm:
            api_version = fcntl.ioctl(kvm, 0xAE00, 0)
            if api_version != 12:
                raise RuntimeError(f"unsupported KVM API version: {api_version}")
            vm = fcntl.ioctl(kvm, 0xAE01, 0)
            os.close(vm)
        PY

    - name: Disable kernel samepage merging
      shell: bash
      run: |
        ksm_directory=/sys/kernel/mm/ksm
        if [[ -d "$ksm_directory" ]]; then
          echo 2 | sudo tee "$ksm_directory/run"
          test "$(cat "$ksm_directory/pages_shared")" = 0
        fi

    - name: Install integration tools
      shell: bash
      run: sudo apt-get install -y nftables iproute2 iptables xfsprogs fdisk udev

    - name: Configure the privileged test runner
      shell: bash
      run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$GITHUB_WORKSPACE/.github/scripts/run-integration-test.sh" >> "$GITHUB_ENV"
