name: Prepare
description: Prepare the environment for the workflow

inputs:
  cache:
    description: Whether to restore and save the cargo and firecracker caches. `enabled` or `disabled`.
    required: true

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        CACHE: ${{ inputs.cache }}
      run: |
        case "$CACHE" in
          enabled | disabled) ;;
          *)
            echo "prepare: cache must be 'enabled' or 'disabled', got '$CACHE'"
            exit 1
            ;;
        esac

    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup toolchain install --no-self-update
        rustup show

    - name: Cargo Cache
      if: inputs.cache == 'enabled'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        cache-on-failure: "true"
        # The key would otherwise hash every toolchain rustup knows about,
        # including the image's own `stable`, which drifts between images.
        # rust-toolchain.toml is already covered by the lockfile hash.
        add-rust-environment-hash-key: "false"

    - name: Firecracker Cache
      if: inputs.cache == 'enabled'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/nibrunner
        key: ${{ runner.os }}-firecracker-${{ hashFiles('crates/nibrunnerd/build.rs') }}
