name: Prepare
description: Prepare the environment for the workflow

inputs:
  cache:
    description: Restore and save the cargo and firecracker caches. Off for a job that compiles nothing.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: rustup show

    - name: Cargo Cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        cache-on-failure: "true"

    - name: Firecracker Cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/nibrunner
        key: ${{ runner.os }}-firecracker-${{ hashFiles('crates/nibrunnerd/build.rs') }}
