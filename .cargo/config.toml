# The daemon is one static binary for x86_64 Linux hosts. musl targets link statically by
# default; the flag is spelled out so nothing can turn it back into a dynamic build.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
