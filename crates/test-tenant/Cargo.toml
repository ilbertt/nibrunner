[package]
name = "nibrunner-test-tenant"
description = "The tenant the guest tests boot: one static binary that answers, remembers, writes and misbehaves on demand"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "test-tenant"
path = "src/main.rs"

[dependencies]

[target.'cfg(target_os = "linux")'.dependencies]
# Only for the one syscall sequence std does not wrap: allocating a PTY, to prove a guest's
# devpts mount actually lets a tenant do it. The guest is the only place this binary runs, so a
# non-Linux host (building it locally to check it compiles) never needs this at all.
nix = { workspace = true, features = ["term"] }

[lints]
workspace = true
