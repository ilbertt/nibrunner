<!doctype html>
<!--
  The card behind a link to the site, `public/og.png`, is a 1200×630 screenshot of this page:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --window-size=1200,630 --screenshot=public/og.png scripts/og.html

  run from docs/ after `bun install`, since the fonts come from node_modules. The page is the
  homepage's parts — its background and grid, its type, the robot — with the room's promise
  written out.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
    @font-face {
      font-family: "Space Grotesk";
      font-weight: 300 700;
      src: url("../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2")
        format("woff2");
    }
    @font-face {
      font-family: "Space Mono";
      src: url("../node_modules/@fontsource/space-mono/files/space-mono-latin-400-normal.woff2")
        format("woff2");
    }
    html,
    body {
      margin: 0;
    }
    body {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: rgb(18 18 18);
      color: rgb(235 235 235);
      font-family: "Space Grotesk", sans-serif;
      letter-spacing: -0.02em;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(
        rgb(179 179 179 / 0.3) 1px,
        transparent 1px
      );
      background-size: 22px 22px;
      mask-image: radial-gradient(
        ellipse 65% 55% at 50% 30%,
        black,
        transparent
      );
    }
    .page {
      position: absolute;
      inset: 0;
      padding: 64px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .name {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 34px;
      font-weight: 600;
    }
    .name img {
      width: 44px;
      height: 44px;
    }
    .robot {
      position: absolute;
      right: 88px;
      top: 96px;
      width: 340px;
      height: 340px;
    }
    h1 {
      margin: 0;
      font-size: 92px;
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -0.035em;
    }
    h1 .vps {
      color: oklch(0.74 0.17 55);
    }
    p {
      margin: 22px 0 0;
      font-size: 32px;
      color: rgb(179 179 179);
    }
    .url {
      position: absolute;
      right: 72px;
      bottom: 64px;
      font-family: "Space Mono", monospace;
      font-size: 22px;
      letter-spacing: 0;
      color: rgb(179 179 179 / 0.8);
    }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="page">
      <div class="name"><img src="../public/logo.svg" alt="">nibrunner</div>
      <img class="robot" src="../public/logo.svg" alt="">
      <div>
        <h1><span class="vps">One VPS.</span><br>Hundreds of apps.</h1>
        <p>MicroVM orchestrator for your VPS</p>
      </div>
      <div class="url">nibrunner.dev</div>
    </div>
  </body>
</html>
